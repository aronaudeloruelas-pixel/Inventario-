  useEffect(() => {
    const unsub = auth.onAuthStateChanged(user => {
      setCurrentUser(user ? user.email.split('@')[0] : null);
      setAuthChecked(true);
      if (!user) { setLoaded(false); setCurrentRole(null); }
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!currentUser) return;
    try {
      const raw = localStorage.getItem(LOCAL_CACHE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.inventory) setInventory(data.inventory);
        if (data.recipes) setRecipes(data.recipes);
        if (data.sales) setSales(data.sales);
        if (data.movements) setMovements(data.movements);
        if (data.deletedOrders) setDeletedOrders(data.deletedOrders);
      }
    } catch (e) {}
  }, [currentUser]);

  useEffect(() => {
    if (!currentUser) return;
    const roleRef = db.ref('roles/' + currentUser);
    let cancelled = false;
    (async () => {
      try {
        const mySnap = await roleRef.once('value');
        if (mySnap.val() == null) {
          const rolesSnap = await db.ref('roles').once('value');
          const rolesVal = rolesSnap.val();
          const initialRole = (!rolesVal || Object.keys(rolesVal).length === 0) ? 'admin' : 'staff';
          if (!cancelled) await roleRef.set(initialRole);
        }
      } catch (e) { /* si falla, el listener de abajo cae a 'staff' por seguridad */ }
    })();
    const listener = roleRef.on('value', snap => {
      const role = snap.val() || 'staff';
      setCurrentRole(role);
      if (role !== 'admin') setView('inventario');
    });
    return () => { cancelled = true; roleRef.off('value', listener); };
  }, [currentUser]);

  useEffect(() => {
    if (!currentUser) return;
    const ref = db.ref(DATA_PATH);
    const listener = ref.on('value', snap => {
      setLoaded(true);
      if (pendingRef.current) return; // no pisar cambios locales aún no sincronizados
      const val = snap.val();
      const str = JSON.stringify(val);
      if (str !== lastRemoteRef.current) {
        lastRemoteRef.current = str;
        if (val) {
          if (val.inventory) setInventory(val.inventory);
          if (val.recipes) setRecipes(val.recipes);
          if (val.sales) setSales(val.sales);
          if (val.movements) setMovements(val.movements);
          if (val.deletedOrders) setDeletedOrders(val.deletedOrders);
        }
      }
    }, err => { console.error(err); setLoaded(true); });
    return () => ref.off('value', listener);
  }, [currentUser]);

  useEffect(() => {
    if (!currentUser) return;
    const connRef = db.ref('.info/connected');
    const listener = connRef.on('value', snap => {
      const online = !!snap.val();
      setIsOnline(online);
      if (online && pendingRef.current) {
        const payload = latestPayloadRef.current;
        const path = currentRole === 'staff' ? DATA_PATH + '/inventory' : DATA_PATH;
        const toSend = currentRole === 'staff' ? payload.inventory : payload;
        db.ref(path).set(toSend).then(() => {
          pendingRef.current = false;
          setHasPending(false);
          lastRemoteRef.current = JSON.stringify(payload);
        }).catch(() => {});
      }
    });
    return () => connRef.off('value', listener);
  }, [currentUser, currentRole]);

  useEffect(() => {
    if (!loaded || !currentUser || currentRole !== 'admin') return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const payload = { inventory, recipes, sales, movements, deletedOrders };
      const str = JSON.stringify(payload);
      try { localStorage.setItem(LOCAL_CACHE_KEY, str); } catch (e) {}
      if (str === lastRemoteRef.current) return;
      pendingRef.current = true;
      setHasPending(true);
      db.ref(DATA_PATH).set(payload).then(() => {
        pendingRef.current = false;
        setHasPending(false);
        lastRemoteRef.current = str;
      }).catch(e => console.error('No se pudo guardar, quedará pendiente hasta reconectar', e));
    }, 400);
  }, [inventory, recipes, sales, movements, deletedOrders, loaded, currentUser, currentRole]);

  useEffect(() => {
    if (!loaded || !currentUser || currentRole !== 'staff') return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const payload = { inventory, recipes, sales, movements, deletedOrders };
      const str = JSON.stringify(payload);
      try { localStorage.setItem(LOCAL_CACHE_KEY, str); } catch (e) {}
      if (str === lastRemoteRef.current) return;
      pendingRef.current = true;
      setHasPending(true);
      db.ref(DATA_PATH + '/inventory').set(inventory).then(() => {
        pendingRef.current = false;
        setHasPending(false);
        lastRemoteRef.current = str;
      }).catch(e => console.error('No se pudo guardar, quedará pendiente hasta reconectar', e));
    }, 400);
  }, [inventory, loaded, currentUser, currentRole]);

  async function handleLogin(username, password) {
    try { await auth.signInWithEmailAndPassword(usernameToEmail(username), password); return ''; }
    catch (e) { return authErrorMessage(e); }
  }

  async function handleRegister(username, password, code) {
    if (!username.trim() || !password) return 'Completa usuario y contraseña';
    try { await auth.createUserWithEmailAndPassword(usernameToEmail(username), password); }
    catch (e) { return authErrorMessage(e); }
    try {
      const rolesSnap = await db.ref('roles').once('value');
      const rolesVal = rolesSnap.val();
      const bootstrap = !rolesVal || Object.keys(rolesVal).length === 0;
      if (!bootstrap) {
        const cleanCode = (code || '').trim().toUpperCase();
        let valid = false;
        if (cleanCode) {
          const codeSnap = await db.ref('inviteCodes/' + cleanCode).once('value');
          const codeVal = codeSnap.val();
          if (codeVal && !codeVal.used) valid = true;
        }
        if (!valid) {
          try { await auth.currentUser.delete(); } catch (e) {}
          await auth.signOut();
          return cleanCode ? 'Código inválido o ya usado' : 'Necesitas un código de invitación, pídeselo a tu administrador';
        }
        await db.ref('inviteCodes/' + cleanCode).update({ used: true, usedBy: sanitizeUsername(username), usedAt: Date.now() });
      }
    } catch (e) {
      try { await auth.currentUser.delete(); } catch (e2) {}
      await auth.signOut();
      return 'No se pudo validar el código, intenta de nuevo';
    }
    return '';
  }

  function handleLogout() { auth.signOut(); }

  function showToast(text, type = 'info') {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ text, type });
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }

  function maxMakeable(recipe) {
    let max = Infinity;
    for (const ing of recipe.ingredients) {
      const inv = inventory.find(i => i.id === ing.invId);
      if (!inv) return 0;
      max = Math.min(max, Math.floor(inv.stock / ing.qty));
    }
    return max === Infinity ? 0 : max;
  }

  function addToCart(recipe) {
    if (maxMakeable(recipe) < 1) { showToast('Sin insumos suficientes para ' + recipe.name, 'error'); return; }
    setInventory(prev => prev.map(inv => {
      const ing = recipe.ingredients.find(x => x.invId === inv.id);
      return ing ? { ...inv, stock: +(inv.stock - ing.qty).toFixed(3) } : inv;
    }));
    setCart(prev => {
      const existing = prev.find(c => c.recipeId === recipe.id);
      if (existing) return prev.map(c => c.recipeId === recipe.id ? { ...c, qty: c.qty + 1 } : c);
      return [...prev, { recipeId: recipe.id, name: recipe.name, price: recipe.price, qty: 1 }];
    });
    showToast(recipe.name + ' agregado — insumos descontados', 'success');
  }

  function returnIngredients(recipeId, times) {
    const recipe = recipes.find(r => r.id === recipeId);
    if (!recipe) return;
    setInventory(prev => prev.map(inv => {
      const ing = recipe.ingredients.find(x => x.invId === inv.id);
      return ing ? { ...inv, stock: +(inv.stock + ing.qty * times).toFixed(3) } : inv;
    }));
  }

  function removeOneFromCart(recipeId) {
    returnIngredients(recipeId, 1);
    setCart(prev => prev.flatMap(c => c.recipeId !== recipeId ? [c] : (c.qty <= 1 ? [] : [{ ...c, qty: c.qty - 1 }])));
  }

  function removeAllFromCart(recipeId) {
    const item = cart.find(c => c.recipeId === recipeId);
    if (item) returnIngredients(recipeId, item.qty);
    setCart(prev => prev.filter(c => c.recipeId !== recipeId));
  }

  function cancelOrder() {
    cart.forEach(item => returnIngredients(item.recipeId, item.qty));
    setCart([]); setCartOpen(false);
    showToast('Orden cancelada, insumos devueltos al inventario', 'info');
  }

  function checkout() {
    if (cart.length === 0) return;
    const total = cart.reduce((s, c) => s + c.price * c.qty, 0);
    const time = ventaDate === todayKey() ? new Date().toISOString() : ventaDate + 'T12:00:00';
    setSales(prev => [...prev, { id: uid('v'), items: cart, total, time }]);
    setCart([]); setCartOpen(false);
    showToast('Venta cobrada: ' + money(total) + (ventaDate !== todayKey() ? ' (' + formatDateLabel(ventaDate) + ')' : ''), 'success');
  }

  function registerManualSale(recipe, qty, dateKey) {
    if (!qty || qty <= 0) return;
    const avail = maxMakeable(recipe);
    if (qty > avail) { showToast('Solo hay insumos para ' + avail + ' de ' + recipe.name, 'error'); return; }
    setInventory(prev => prev.map(inv => {
      const ing = recipe.ingredients.find(x => x.invId === inv.id);
      return ing ? { ...inv, stock: +(inv.stock - ing.qty * qty).toFixed(3) } : inv;
    }));
    const time = dateKey === todayKey() ? new Date().toISOString() : dateKey + 'T12:00:00';
    setSales(prev => [...prev, { id: uid('v'), items: [{ recipeId: recipe.id, name: recipe.name, price: recipe.price, qty }], total: recipe.price * qty, time }]);
    showToast('Registradas ' + qty + ' venta(s) de ' + recipe.name, 'success');
  }

  function registerMovement(type, invId, qty, note, dateKey) {
    if (!qty || qty <= 0) return;
    const inv = inventory.find(i => i.id === invId);
    if (!inv) return;
    setInventory(prev => prev.map(i => {
      if (i.id !== invId) return i;
      const stock = type === 'entrada' ? i.stock + qty : Math.max(0, i.stock - qty);
      return { ...i, stock: +stock.toFixed(3) };
    }));
    setMovements(prev => [...prev, { id: uid('m'), type, invId, qty, note: note || '', date: dateKey, time: new Date().toISOString() }]);
    showToast(type === 'entrada' ? ('Entrada registrada: +' + qty + ' ' + inv.unit + ' de ' + inv.name) : ('Salida registrada: -' + qty + ' ' + inv.unit + ' de ' + inv.name), 'success');
  }

  function deleteSaleQuantity(dateKey, productName, qtyToRemove, reason) {
    let remaining = qtyToRemove;
    let revenueRemoved = 0;
    let matchedRecipeId = null;
    const updatedSales = [];
    for (const s of sales) {
      if (toDateKey(s.time) !== dateKey || remaining <= 0) { updatedSales.push(s); continue; }
      let saleChanged = false;
      const newItems = [];
      for (const it of s.items) {
        if (it.name === productName && remaining > 0) {
          matchedRecipeId = matchedRecipeId || it.recipeId;
          const removeQty = Math.min(remaining, it.qty);
          remaining -= removeQty;
          revenueRemoved += removeQty * it.price;
          saleChanged = true;
          const leftQty = it.qty - removeQty;
          if (leftQty > 0) newItems.push({ ...it, qty: leftQty });
        } else {
          newItems.push(it);
        }
      }
      if (!saleChanged) { updatedSales.push(s); continue; }
      if (newItems.length === 0) continue;
      const newTotal = newItems.reduce((sum, x) => sum + x.price * x.qty, 0);
      updatedSales.push({ ...s, items: newItems, total: newTotal });
    }
    const removedQty = qtyToRemove - remaining;
    if (removedQty <= 0) { showToast('No había esa cantidad para eliminar', 'error'); return false; }
    setSales(updatedSales);
    const recipe = recipes.find(r => r.id === matchedRecipeId) || recipes.find(r => r.name === productName);
    if (recipe) {
      setInventory(prev => prev.map(inv => {
        const ing = recipe.ingredients.find(x => x.invId === inv.id);
        return ing ? { ...inv, stock: +(inv.stock + ing.qty * removedQty).toFixed(3) } : inv;
      }));
    }
    setDeletedOrders(prev => [...prev, { id: uid('d'), date: dateKey, product: productName, qty: removedQty, revenue: revenueRemoved, reason, time: new Date().toISOString() }]);
    showToast('Eliminadas ' + removedQty + ' de ' + productName + ' — insumos devueltos', 'success');
    return true;
  }

  function saveInventoryItem(data) {
    setInventory(prev => {
      const exists = prev.some(i => i.id === data.id);
      return exists ? prev.map(i => i.id === data.id ? data : i) : [...prev, { ...data, id: uid('i') }];
    });
    setItemModal(null);
  }

  function deleteInventoryItem(id) {
    const usedIn = recipes.filter(r => r.ingredients.some(ing => ing.invId === id));
    if (usedIn.length > 0) { showToast('No se puede borrar: lo usan ' + usedIn.map(r => r.name).join(', '), 'error'); return; }
    setInventory(prev => prev.filter(i => i.id !== id));
  }

  function applyRecipeSave(data, updateSalesToo) {
    setRecipes(prev => {
      const exists = prev.some(r => r.id === data.id);
      return exists ? prev.map(r => r.id === data.id ? data : r) : [...prev, { ...data, id: uid('r') }];
    });
    if (updateSalesToo) {
      setSales(prev => prev.map(s => {
        let changed = false;
        const newItems = s.items.map(it => {
          if (it.recipeId === data.id) { changed = true; return { ...it, price: data.price }; }
          return it;
        });
        if (!changed) return s;
        const newTotal = newItems.reduce((sum, x) => sum + x.price * x.qty, 0);
        return { ...s, items: newItems, total: newTotal };
      }));
      showToast('Precio actualizado, incluyendo ventas anteriores', 'success');
    } else {
      showToast('Precio actualizado (las ventas anteriores no cambian)', 'success');
    }
  }

  function saveRecipe(data) {
    const oldRecipe = recipes.find(r => r.id === data.id);
    if (oldRecipe && Number(oldRecipe.price) !== Number(data.price)) {
      setRecipeModal(null);
      setPriceConfirmModal({ data, oldRecipe });
      return;
    }
    applyRecipeSave(data, false);
    setRecipeModal(null);
  }

  function deleteRecipe(id) { setRecipes(prev => prev.filter(r => r.id !== id)); }

  const cartCount = cart.reduce((s, c) => s + c.qty, 0);
  const cartTotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const categories = [...new Set(recipes.map(r => r.category || 'Otros'))];

  return (
    <div className="posapp" style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      {!authChecked ? (
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, color: '#8B9199' }}>Cargando…</div>
      ) : !currentUser ? (
        <AuthScreen onLogin={handleLogin} onRegister={handleRegister} />
      ) : !currentRole ? (
        <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, color: '#8B9199' }}>Cargando…</div>
      ) : currentRole === 'blocked' ? (
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 24px', textAlign: 'center' }}>
          <Icon size={36}>🚫</Icon>
          <p style={{ fontSize: 15, fontWeight: 600, marginTop: 12 }}>Tu cuenta fue deshabilitada</p>
          <p style={{ fontSize: 13, color: '#8B9199', marginTop: 6 }}>Contacta a tu administrador si crees que es un error.</p>
          <button onClick={handleLogout} className="btn btn-ghost" style={{ padding: '8px 16px', marginTop: 16, fontSize: 12 }}>Salir</button>
        </div>
      ) : (
      <React.Fragment>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 16px', borderBottom: '1px solid #33393F', paddingTop: 'calc(env(safe-area-inset-top) + 12px)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <Icon size={20}>👨‍🍳</Icon>
          <span className="display" style={{ fontSize: 18, fontWeight: 600 }}>Cocina POS</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div className="mono" style={{ fontSize: 12, color: '#8B9199' }}>
            Ventas hoy: <span style={{ color: '#E3A23D' }}>{money(sales.filter(s => toDateKey(s.time) === todayKey()).reduce((s, v) => s + v.total, 0))}</span>
          </div>
          <button onClick={handleLogout} style={{ background: 'none', border: 'none', color: '#8B9199', textDecoration: 'underline', fontSize: 11, cursor: 'pointer' }}>Salir ({currentUser} · {currentRole === 'admin' ? 'Admin' : 'Personal'})</button>
        </div>
      </div>

      {!isOnline && (
        <div style={{ background: '#C97F1F', color: '#201705', fontSize: 12, fontWeight: 600, textAlign: 'center', padding: '6px 10px' }}>
          🔌 Sin conexión — puedes seguir trabajando, se sincronizará solo al volver internet
        </div>
      )}
      {isOnline && hasPending && (
        <div style={{ background: '#6FA97A', color: '#0f2013', fontSize: 12, fontWeight: 600, textAlign: 'center', padding: '6px 10px' }}>
          ☁️ Sincronizando cambios pendientes…
        </div>
      )}

      <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 96 }}>
        {currentRole === 'admin' && view === 'dashboard' && <DashboardView recipes={recipes} inventory={inventory} sales={sales} />}
        {currentRole === 'admin' && view === 'venta' && <VentaView recipes={recipes} categories={categories} maxMakeable={maxMakeable} addToCart={addToCart} ventaDate={ventaDate} setVentaDate={setVentaDate} />}
        {currentRole === 'admin' && view === 'productos' && (
          <ProductosView recipes={recipes} inventory={inventory} maxMakeable={maxMakeable} onEdit={(r) => setRecipeModal({ data: r })} onNew={() => setRecipeModal({ data: { id: uid('r'), name: '', category: '', price: '', ingredients: [] } })} onDelete={deleteRecipe} onRegisterSale={registerManualSale} />
        )}
        {view === 'inventario' && (
          <InventarioView role={currentRole} inventory={inventory} movements={movements} onEdit={(it) => setItemModal({ data: it })} onNew={() => setItemModal({ data: { id: uid('i'), name: '', unit: '', stock: 0, minStock: 0 } })} onDelete={deleteInventoryItem} onQuickAdjust={(id, delta) => setInventory(prev => prev.map(i => i.id === id ? { ...i, stock: Math.max(0, +(i.stock + delta).toFixed(3)) } : i))} onEntrada={() => setMovementModal({ type: 'entrada' })} onSalida={() => setMovementModal({ type: 'salida' })} />
        )}
        {currentRole === 'admin' && view === 'historial' && <HistorialView sales={sales} movements={movements} inventory={inventory} deletedOrders={deletedOrders} onRequestDelete={(date, products) => setDeleteSaleModal({ date, products })} />}
        {currentRole === 'admin' && view === 'reportes' && <ReportesView sales={sales} movements={movements} inventory={inventory} recipes={recipes} deletedOrders={deletedOrders} />}
        {currentRole === 'admin' && view === 'usuarios' && <UsersView currentUser={currentUser} />}
      </div>

      {currentRole === 'admin' && view === 'venta' && cartCount > 0 && !cartOpen && (
        <button onClick={() => setCartOpen(true)} className="btn btn-amber" style={{ position: 'fixed', left: 16, right: 16, bottom: 84, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 16px', boxShadow: '0 6px 20px rgba(0,0,0,0.4)' }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}><Icon>🧾</Icon> Ver orden ({cartCount})</span>
          <span className="mono">{money(cartTotal)}</span>
        </button>
      )}

      <div className="tab-bar" style={{ position: 'fixed', bottom: 0, left: 0, right: 0, display: 'flex', justifyContent: 'space-around', paddingTop: 8, overflowX: 'auto' }}>
        {(currentRole === 'admin' ? [
          { k: 'dashboard', label: 'Panel', icon: '📊' },
          { k: 'venta', label: 'Vender', icon: '🛍️' },
          { k: 'productos', label: 'Productos', icon: '🍽️' },
          { k: 'inventario', label: 'Inventario', icon: '📦' },
          { k: 'historial', label: 'Historial', icon: '📅' },
          { k: 'reportes', label: 'Reportes', icon: '📈' },
          { k: 'usuarios', label: 'Usuarios', icon: '👥' },
        ] : [
          { k: 'inventario', label: 'Inventario', icon: '📦' },
        ]).map(t => (
          <button key={t.k} onClick={() => setView(t.k)} className={'tab-btn' + (view === t.k ? ' active' : '')} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, padding: '4px 10px' }}>
            <Icon size={18}>{t.icon}</Icon>
            <span style={{ fontSize: 10, fontWeight: 500 }}>{t.label}</span>
          </button>
        ))}
      </div>

      {cartOpen && (
        <div onClick={() => setCartOpen(false)} style={{ position: 'fixed', inset: 0, zIndex: 40, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', background: 'rgba(0,0,0,0.6)' }}>
          <div className="ticket" onClick={e => e.stopPropagation()} style={{ padding: 16, margin: '0 12px 12px', maxHeight: '75vh', overflowY: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
              <span className="display" style={{ fontSize: 18, fontWeight: 600 }}>Orden actual</span>
              <button onClick={() => setCartOpen(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#241F19' }}><Icon size={20}>✕</Icon></button>
            </div>
            {cart.length === 0 ? (
              <p style={{ fontSize: 14, color: '#6b655a' }}>No hay productos en la orden.</p>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, borderTop: '1px dashed #c9c2b0', borderBottom: '1px dashed #c9c2b0' }}>
                {cart.map(c => (
                  <div key={c.recipeId} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px dashed #e2ddce' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>{c.name}</div>
                      <div className="mono" style={{ fontSize: 12, color: '#8a8271' }}>{money(c.price)} c/u</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <button onClick={() => removeOneFromCart(c.recipeId)} className="btn btn-ghost" style={{ borderColor: '#c9c2b0', color: '#241F19', width: 28, height: 28 }}>−</button>
                      <span className="mono" style={{ fontSize: 14, width: 16, textAlign: 'center' }}>{c.qty}</span>
                      <button onClick={() => addToCart(recipes.find(r => r.id === c.recipeId))} className="btn btn-ghost" style={{ borderColor: '#c9c2b0', color: '#241F19', width: 28, height: 28 }}>+</button>
                      <button onClick={() => removeAllFromCart(c.recipeId)} style={{ marginLeft: 4, background: 'none', border: 'none', color: '#D6553F', cursor: 'pointer' }}><Icon size={16}>🗑</Icon></button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', margin: '12px 0 16px' }}>

function generateInviteCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function startOfWeek(d) { const r = new Date(d); const day = (r.getDay() + 6) % 7; r.setDate(r.getDate() - day); r.setHours(0, 0, 0, 0); return r; }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function getPeriodRange(anchorKey, mode) {
  const anchor = new Date(anchorKey + 'T00:00:00');
  if (mode === 'semana') {
    const start = startOfWeek(anchor);
    const end = addDays(start, 6);
    const prevStart = addDays(start, -7);
    const prevEnd = addDays(start, -1);
    return { start, end, prevStart, prevEnd, label: 'Semana del ' + start.toLocaleDateString('es', { day: 'numeric', month: 'short' }) + ' al ' + end.toLocaleDateString('es', { day: 'numeric', month: 'short' }) };
  }
  const start = startOfMonth(anchor);
  const end = endOfMonth(anchor);
  const prevStart = startOfMonth(new Date(anchor.getFullYear(), anchor.getMonth() - 1, 1));
  const prevEnd = endOfMonth(prevStart);
  return { start, end, prevStart, prevEnd, label: start.toLocaleDateString('es', { month: 'long', year: 'numeric' }) };
}
function inRange(dateKeyOrIso, start, end) {
  const d = new Date((dateKeyOrIso.length <= 10 ? dateKeyOrIso + 'T00:00:00' : dateKeyOrIso));
  return d >= start && d <= end;
}
function pctChange(curr, prev) {
  if (!prev) return curr > 0 ? 100 : 0;
  return ((curr - prev) / prev) * 100;
}

function ReportesView({ sales, movements, inventory, recipes, deletedOrders }) {
  const [mode, setMode] = useState('semana');
  const [anchorKey, setAnchorKey] = useState(todayKey());
  const [exporting, setExporting] = useState(false);

  const { start, end, prevStart, prevEnd, label } = getPeriodRange(anchorKey, mode);

  function shift(delta) {
    const anchor = new Date(anchorKey + 'T00:00:00');
    if (mode === 'semana') setAnchorKey(toDateKey(addDays(anchor, delta * 7)));
    else setAnchorKey(toDateKey(new Date(anchor.getFullYear(), anchor.getMonth() + delta, 1)));
  }

  const currSales = sales.filter(s => inRange(s.time, start, end));
  const prevSales = sales.filter(s => inRange(s.time, prevStart, prevEnd));
  const currSalidas = movements.filter(m => m.type === 'salida' && inRange(m.date, start, end));
  const prevSalidas = movements.filter(m => m.type === 'salida' && inRange(m.date, prevStart, prevEnd));

  const currRevenue = currSales.reduce((s, v) => s + v.total, 0);
  const prevRevenue = prevSales.reduce((s, v) => s + v.total, 0);
  const currOrders = currSales.length;
  const prevOrders = prevSales.length;
  const currAvg = currOrders ? currRevenue / currOrders : 0;
  const prevAvg = prevOrders ? prevRevenue / prevOrders : 0;

  const currByProduct = {};
  currSales.forEach(s => s.items.forEach(it => { currByProduct[it.name] = (currByProduct[it.name] || 0) + it.qty; }));
  const prevByProduct = {};
  prevSales.forEach(s => s.items.forEach(it => { prevByProduct[it.name] = (prevByProduct[it.name] || 0) + it.qty; }));
  const allProductNames = [...new Set([...Object.keys(currByProduct), ...Object.keys(prevByProduct)])].sort((a, b) => (currByProduct[b] || 0) - (currByProduct[a] || 0));

  function MetricCard({ title, curr, prev, isMoney }) {
    const change = pctChange(curr, prev);
    const up = change >= 0;
    return (
      <div className="card" style={{ padding: 12 }}>
        <div style={{ fontSize: 12, color: '#8B9199' }}>{title}</div>
        <div className="mono" style={{ fontSize: 18, fontWeight: 600, marginTop: 4 }}>{isMoney ? money(curr) : curr}</div>
        <div style={{ fontSize: 11, marginTop: 4, color: up ? '#6FA97A' : '#D6553F' }}>
          {up ? '▲' : '▼'} {Math.abs(change).toFixed(0)}% vs. anterior ({isMoney ? money(prev) : prev})
        </div>
      </div>
    );
  }

  function exportToExcel() {
    setExporting(true);
    try {
      const wb = XLSX.utils.book_new();

      const invRows = inventory.map(i => ({ Insumo: i.name, Unidad: i.unit, Stock: i.stock, StockMinimo: i.minStock }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invRows), 'Inventario');

      const recRows = recipes.map(r => ({
        Producto: r.name, Categoria: r.category, Precio: r.price,
        Insumos: r.ingredients.map(ing => { const inv = inventory.find(i => i.id === ing.invId); return inv ? (inv.name + ' x' + ing.qty) : ''; }).filter(Boolean).join('; ')
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(recRows), 'Productos');

      const saleRows = [];
      sales.forEach(s => s.items.forEach(it => {
        saleRows.push({ Fecha: toDateKey(s.time), Hora: new Date(s.time).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }), Producto: it.name, Cantidad: it.qty, PrecioUnitario: it.price, Total: it.qty * it.price });
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(saleRows), 'Ventas');

      const movRows = movements.map(m => {
        const inv = inventory.find(i => i.id === m.invId);
        return { Fecha: m.date, Tipo: m.type === 'entrada' ? 'Entrada' : 'Salida', Insumo: inv ? inv.name : '?', Cantidad: m.qty, Nota: m.note || '' };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movRows), 'Movimientos');

      const delRows = (deletedOrders || []).map(d => ({ Fecha: d.date, Producto: d.product, Cantidad: d.qty, Monto: d.revenue, Motivo: d.reason, Hora: new Date(d.time).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(delRows), 'Pedidos eliminados');

      XLSX.writeFile(wb, 'cocina-pos-export-' + todayKey() + '.xlsx');
    } catch (e) { console.error(e); }
    setExporting(false);
  }

  return (
    <div style={{ padding: '16px 16px 0', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="card" style={{ padding: 12 }}>
        <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Exportar todo a Excel</div>
        <button onClick={exportToExcel} disabled={exporting} className="btn btn-amber" style={{ width: '100%', padding: '10px 0', justifyContent: 'center', fontSize: 12, fontWeight: 600, opacity: exporting ? 0.5 : 1 }}>
          {exporting ? 'Generando…' : '⬇️ Descargar Excel (.xlsx)'}
        </button>
        <p style={{ fontSize: 11, color: '#8B9199', marginTop: 8 }}>Incluye inventario, productos, ventas, movimientos y pedidos eliminados.</p>
      </div>

      <div style={{ display: 'flex', gap: 8 }}>
        <button onClick={() => setMode('semana')} className={'btn ' + (mode === 'semana' ? 'btn-amber' : 'btn-ghost')} style={{ flex: 1, padding: '8px 0', fontSize: 12, fontWeight: 600, justifyContent: 'center' }}>Semana vs semana</button>
        <button onClick={() => setMode('mes')} className={'btn ' + (mode === 'mes' ? 'btn-amber' : 'btn-ghost')} style={{ flex: 1, padding: '8px 0', fontSize: 12, fontWeight: 600, justifyContent: 'center' }}>Mes vs mes</button>
      </div>

      <div className="card" style={{ padding: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <button onClick={() => shift(-1)} className="btn btn-ghost" style={{ width: 32, height: 32 }}>‹</button>
        <span className="display" style={{ fontSize: 13, fontWeight: 600, textTransform: 'capitalize', textAlign: 'center' }}>{label}</span>
        <button onClick={() => shift(1)} className="btn btn-ghost" style={{ width: 32, height: 32 }}>›</button>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <MetricCard title="Ventas" curr={currRevenue} prev={prevRevenue} isMoney />
        <MetricCard title="Pedidos" curr={currOrders} prev={prevOrders} />
        <MetricCard title="Ticket promedio" curr={currAvg} prev={prevAvg} isMoney />
        <MetricCard title="Salidas de insumo" curr={currSalidas.length} prev={prevSalidas.length} />
      </div>

      <div className="card" style={{ padding: 12 }}>
        <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Productos: periodo actual vs anterior</div>
        {allProductNames.length === 0 ? (
          <p style={{ fontSize: 12, color: '#8B9199' }}>Sin ventas en ninguno de los dos periodos.</p>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {allProductNames.map(name => (
              <div key={name} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, borderBottom: '1px solid #33393F', paddingBottom: 4 }}>
                <span>{name}</span>
                <span className="mono">{currByProduct[name] || 0} <span style={{ color: '#8B9199' }}>(antes {prevByProduct[name] || 0})</span></span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function UsersView({ currentUser }) {
  const [roles, setRoles] = useState(null);
  const [busyKey, setBusyKey] = useState(null);
  const [confirmingKey, setConfirmingKey] = useState(null);
  const [codes, setCodes] = useState(null);
  const [generating, setGenerating] = useState(false);

  useEffect(() => {
    const ref = db.ref('roles');
    const listener = ref.on('value', snap => setRoles(snap.val() || {}));
    return () => ref.off('value', listener);
  }, []);

  useEffect(() => {
    const ref = db.ref('inviteCodes');
    const listener = ref.on('value', snap => setCodes(snap.val() || {}));
    return () => ref.off('value', listener);
  }, []);

  async function toggleRole(key, current) {
    setBusyKey(key);
    try { await db.ref('roles/' + key).set(current === 'admin' ? 'staff' : 'admin'); }
    catch (e) {}
    setBusyKey(null);
  }

  async function blockUser(key) {
    setBusyKey(key);
    try { await db.ref('roles/' + key).set('blocked'); } catch (e) {}
    setBusyKey(null);
    setConfirmingKey(null);
  }

  async function reactivateUser(key) {
    setBusyKey(key);
    try { await db.ref('roles/' + key).set('staff'); } catch (e) {}
    setBusyKey(null);
  }

  async function handleGenerateCode() {
    setGenerating(true);
    const code = generateInviteCode();
    try { await db.ref('inviteCodes/' + code).set({ createdAt: Date.now(), used: false, createdBy: currentUser }); }
    catch (e) {}
    setGenerating(false);
  }

  async function revokeCode(code) {
    try { await db.ref('inviteCodes/' + code).remove(); } catch (e) {}
  }

  const entries = roles ? Object.entries(roles) : [];
  const codeEntries = codes ? Object.entries(codes).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0)) : [];
  const appUrl = window.location.origin + window.location.pathname;
  const roleLabel = (role) => role === 'admin' ? 'Administrador' : role === 'blocked' ? 'Deshabilitada' : 'Personal';
  const roleColor = (role) => role === 'admin' ? '#E3A23D' : role === 'blocked' ? '#D6553F' : '#8B9199';

  return (
    <div style={{ padding: '16px 16px 0', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="card" style={{ padding: 12 }}>
        <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Códigos de invitación</div>
        <p style={{ fontSize: 12, color: '#8B9199', marginBottom: 10 }}>Genera un código y compártelo con la persona que quieres invitar. Solo funciona una vez.</p>
        <button onClick={handleGenerateCode} disabled={generating} className="btn btn-amber" style={{ width: '100%', padding: '10px 0', justifyContent: 'center', fontSize: 12, fontWeight: 600, opacity: generating ? 0.5 : 1 }}>
          {generating ? 'Generando…' : '+ Generar código'}
        </button>
        {codeEntries.length > 0 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 12 }}>
            {codeEntries.map(([code, info]) => (
              <div key={code} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderTop: '1px solid #33393F', paddingTop: 8 }}>
                <div>
                  <div className="mono" style={{ fontSize: 16, fontWeight: 600, letterSpacing: 1 }}>{code}</div>
                  <div style={{ fontSize: 11, color: info.used ? '#D6553F' : '#6FA97A' }}>{info.used ? 'Usado por ' + info.usedBy : 'Disponible'}</div>
                </div>
                {!info.used && (
                  <div style={{ display: 'flex', gap: 8 }}>
                    <a
                      href={'https://api.whatsapp.com/send?text=' + encodeURIComponent('Tu código de invitación para Cocina POS es: ' + code + '\n' + appUrl)}
                      target="_blank" rel="noopener noreferrer"
                      style={{ color: '#25D366', display: 'flex', alignItems: 'center' }}
                    >
                      <Icon size={18}>📲</Icon>
                    </a>
                    <button onClick={() => revokeCode(code)} style={{ background: 'none', border: 'none', color: '#D6553F', cursor: 'pointer' }}><Icon size={16}>🗑</Icon></button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="card" style={{ padding: 10, fontSize: 12, color: '#8B9199' }}>
        Administrador: acceso completo. Personal: solo inventario y entradas. Deshabilitada: no puede entrar a la app.
      </div>
      {roles === null ? (
        <p style={{ fontSize: 12, color: '#8B9199' }}>Cargando…</p>
      ) : entries.length === 0 ? (
        <p style={{ fontSize: 12, color: '#8B9199' }}>Aún no hay usuarios registrados.</p>
      ) : (
        entries.map(([key, role]) => (
          <div key={key} className="card" style={{ padding: 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 600 }}>{key}{key === currentUser && ' (tú)'}</div>
                <div style={{ fontSize: 12, color: roleColor(role) }}>{roleLabel(role)}</div>
              </div>
              {key !== currentUser && role !== 'blocked' && (
                <button onClick={() => toggleRole(key, role)} disabled={busyKey === key} className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 11, fontWeight: 600, opacity: busyKey === key ? 0.5 : 1 }}>
                  {role === 'admin' ? 'Quitar admin' : 'Hacer admin'}
                </button>
              )}
            </div>
            {key !== currentUser && (
              <div style={{ marginTop: 10, borderTop: '1px solid #33393F', paddingTop: 10 }}>
                {role === 'blocked' ? (
                  <button onClick={() => reactivateUser(key)} disabled={busyKey === key} className="btn btn-green" style={{ width: '100%', padding: '8px 0', fontSize: 11, fontWeight: 600, justifyContent: 'center', opacity: busyKey === key ? 0.5 : 1 }}>
                    Reactivar cuenta
                  </button>
                ) : confirmingKey === key ? (
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={() => setConfirmingKey(null)} className="btn btn-ghost" style={{ flex: 1, padding: '8px 0', fontSize: 11, justifyContent: 'center' }}>Cancelar</button>
                    <button onClick={() => blockUser(key)} disabled={busyKey === key} className="btn btn-danger" style={{ flex: 1, padding: '8px 0', fontSize: 11, fontWeight: 600, justifyContent: 'center', opacity: busyKey === key ? 0.5 : 1 }}>Sí, eliminar</button>
                  </div>
                ) : (
                  <button onClick={() => setConfirmingKey(key)} className="btn btn-danger" style={{ width: '100%', padding: '8px 0', fontSize: 11, fontWeight: 600, justifyContent: 'center' }}>
                    Eliminar cuenta
                  </button>
                )}
              </div>
            )}
          </div>
        ))
      )}
    </div>
  );
}

function DashboardView({ recipes, inventory, sales }) {

  const topProducts = allProductsSold.filter(p => p.qty > 0).slice(0, 5);
  const maxQty = Math.max(1, ...topProducts.map(p => p.qty));

  const lowStock = inventory.filter(i => i.stock <= i.minStock);
  const recent = [...sales].sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 5);

  return (
    <div style={{ padding: '16px 16px 0', display: 'flex', flexDirection: 'column', gap: 16 }}>

function InventarioView({ role, inventory, movements, onEdit, onNew, onDelete, onQuickAdjust, onEntrada, onSalida }) {
  const isAdmin = role === 'admin';
  const [sub, setSub] = useState('stock');
  const [moveDate, setMoveDate] = useState(todayKey());
  const [sortAlpha, setSortAlpha] = useState(false);
  const invName = (id) => { const i = inventory.find(x => x.id === id); return i ? i.name : '?'; };
  const invUnit = (id) => { const i = inventory.find(x => x.id === id); return i ? i.unit : ''; };
  const dayEntradas = movements.filter(m => m.type === 'entrada' && m.date === moveDate);
  const daySalidas = movements.filter(m => m.type === 'salida' && m.date === moveDate);
  const displayedInventory = sortAlpha ? [...inventory].sort((a, b) => a.name.localeCompare(b.name, 'es')) : inventory;

  return (
    <div style={{ padding: '16px 16px 0', display: 'flex', flexDirection: 'column', gap: 8 }}>

        <div className="card" style={{ padding: 10, fontSize: 12, color: '#8B9199', marginBottom: 4 }}>
          Solo puedes ver el inventario y registrar entradas de insumos.

      <div style={{ display: 'grid', gridTemplateColumns: isAdmin ? '1fr 1fr 1fr' : '1fr', gap: 8, marginBottom: 4 }}>

        {isAdmin && <button onClick={onSalida} className="btn btn-danger" style={{ padding: '10px 0', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, fontSize: 11, fontWeight: 600 }}><Icon size={16}>⬆️</Icon> Salida</button>}
        {isAdmin && <button onClick={onNew} className="btn btn-ghost" style={{ padding: '10px 0', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, fontSize: 11, fontWeight: 600 }}>+ Insumo</button>}
      </div>

      <div style={{ display: 'flex', gap: 8, marginBottom: 4 }}>
        <button onClick={() => setSub('stock')} className={'btn ' + (sub === 'stock' ? 'btn-amber' : 'btn-ghost')} style={{ flex: 1, padding: '8px 0', fontSize: 12, fontWeight: 600 }}>Stock actual</button>
        <button onClick={() => setSub('movimientos')} className={'btn ' + (sub === 'movimientos' ? 'btn-amber' : 'btn-ghost')} style={{ flex: 1, padding: '8px 0', fontSize: 12, fontWeight: 600 }}>Movimientos por fecha</button>
      </div>

      {sub === 'stock' && (
        <button onClick={() => setSortAlpha(v => !v)} className={'btn ' + (sortAlpha ? 'btn-amber' : 'btn-ghost')} style={{ padding: '8px 0', fontSize: 12, fontWeight: 600, justifyContent: 'center', marginBottom: 2 }}>
          🔤 {sortAlpha ? 'Orden A-Z activo (tocar para quitar)' : 'Ordenar A-Z'}

      {sub === 'stock' && displayedInventory.map(it => {

          <div key={it.id} className="card" style={{ padding: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 600 }}>{it.name}</div>
              <div className={'mono ' + (low ? 'stock-low' : 'stock-ok')} style={{ fontSize: 12 }}>{it.stock} {it.unit} {low && '· bajo'}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              {low && (
                <a href={waLink('⚠️ ' + it.name + ' está por terminarse — quedan ' + it.stock + ' ' + it.unit + '.')} target="_blank" rel="noopener noreferrer" style={{ color: '#25D366', display: 'flex' }}>

          )}

            <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 4, color: '#6FA97A' }}><Icon size={14}>⬇️</Icon> Entradas</div>
            {dayEntradas.length === 0 ? <p style={{ fontSize: 12, color: '#8B9199' }}>Sin entradas este día.</p> : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                {dayEntradas.map(m => (
                  <div key={m.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14 }}>
                    <span>{invName(m.invId)}{m.note && <span style={{ fontSize: 11, color: '#8B9199' }}> · {m.note}</span>}</span>
                    <span className="mono stock-ok">+{m.qty} {invUnit(m.invId)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="card" style={{ padding: 12 }}>
            <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 4, color: '#D6553F' }}><Icon size={14}>⬆️</Icon> Salidas</div>
            {daySalidas.length === 0 ? <p style={{ fontSize: 12, color: '#8B9199' }}>Sin salidas este día.</p> : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                {daySalidas.map(m => (
                  <div key={m.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14 }}>

function HistorialView({ sales, movements, inventory, deletedOrders, onRequestDelete }) {
  const [date, setDate] = useState(todayKey());
  const daySales = sales.filter(s => toDateKey(s.time) === date);
  const dayEntradas = movements.filter(m => m.type === 'entrada' && m.date === date);
  const daySalidas = movements.filter(m => m.type === 'salida' && m.date === date);
  const totalVentas = daySales.reduce((s, v) => s + v.total, 0);
  const invName = (id) => { const i = inventory.find(x => x.id === id); return i ? i.name : '?'; };
  const invUnit = (id) => { const i = inventory.find(x => x.id === id); return i ? i.unit : ''; };

  const dayProductTotals = {};
  daySales.forEach(s => s.items.forEach(it => {
    if (!dayProductTotals[it.name]) dayProductTotals[it.name] = { name: it.name, qty: 0, revenue: 0 };
    dayProductTotals[it.name].qty += it.qty;
    dayProductTotals[it.name].revenue += it.price * it.qty;
  }));
  const dayProductList = Object.values(dayProductTotals);
  const dayDeleted = (deletedOrders || []).filter(d => d.date === date).sort((a, b) => new Date(b.time) - new Date(a.time));

  return (
    <div style={{ padding: '16px 16px 0', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="card" style={{ padding: 12, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <button onClick={() => setDate(shiftDateKey(date, -1))} className="btn btn-ghost" style={{ width: 32, height: 32 }}>‹</button>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <span className="display" style={{ fontSize: 13, fontWeight: 600, textTransform: 'capitalize' }}>{formatDateLabel(date)}</span>
          <input type="date" className="input mono" style={{ width: 150, textAlign: 'center', fontSize: 12, marginTop: 4 }} value={date} onChange={e => setDate(e.target.value)} />
        </div>
        <button onClick={() => setDate(shiftDateKey(date, 1))} className="btn btn-ghost" style={{ width: 32, height: 32 }}>›</button>
      </div>
      {date !== todayKey() && (
        <button onClick={() => setDate(todayKey())} className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12, alignSelf: 'center' }}>Volver a hoy</button>
      )}

      <div className="card" style={{ padding: 12 }}>
        <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span>Ventas del día</span>
          <span className="mono" style={{ color: '#E3A23D' }}>{money(totalVentas)}</span>
        </div>
        {daySales.length === 0 ? <p style={{ fontSize: 12, color: '#8B9199' }}>Sin ventas registradas este día.</p> : (
          <React.Fragment>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {daySales.map(s => (
              <div key={s.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, borderBottom: '1px solid #33393F', paddingBottom: 6 }}>
                <div>
                  <div>{s.items.map(it => it.qty + 'x ' + it.name).join(', ')}</div>
                  <div style={{ fontSize: 11, color: '#8B9199' }}>{new Date(s.time).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })}</div>
                </div>
                <span className="mono">{money(s.total)}</span>
              </div>
            ))}
          </div>
          <button onClick={() => onRequestDelete(date, dayProductList)} className="btn btn-danger" style={{ width: '100%', padding: '10px 0', marginTop: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, fontSize: 12, fontWeight: 600 }}>
            <Icon size={14}>🗑</Icon> Eliminar platillos de una venta
          </button>
          </React.Fragment>
        )}
      </div>

      <div className="card" style={{ padding: 12 }}>
        <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 4, color: '#8B9199' }}><Icon size={14}>🗑</Icon> Pedidos eliminados</div>
        {dayDeleted.length === 0 ? <p style={{ fontSize: 12, color: '#8B9199' }}>Sin eliminaciones este día.</p> : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {dayDeleted.map(d => (
              <div key={d.id} style={{ fontSize: 14, borderBottom: '1px solid #33393F', paddingBottom: 6 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                  <span>{d.qty}x {d.product}</span>
                  <span className="mono stock-low">-{money(d.revenue)}</span>
                </div>
                <div style={{ fontSize: 11, color: '#8B9199' }}>Motivo: {d.reason} · {new Date(d.time).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="card" style={{ padding: 12 }}>
        <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 4, color: '#6FA97A' }}><Icon size={14}>⬇️</Icon> Entradas de inventario</div>
        {dayEntradas.length === 0 ? <p style={{ fontSize: 12, color: '#8B9199' }}>Sin entradas este día.</p> : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
            {dayEntradas.map(m => (
              <div key={m.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14 }}>
                <span>{invName(m.invId)}{m.note && <span style={{ fontSize: 11, color: '#8B9199' }}> · {m.note}</span>}</span>
                <span className="mono stock-ok">+{m.qty} {invUnit(m.invId)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="card" style={{ padding: 12 }}>
        <div className="display" style={{ fontSize: 14, fontWeight: 600, marginBottom: 8, display: 'flex', alignItems: 'center', gap: 4, color: '#D6553F' }}><Icon size={14}>⬆️</Icon> Salidas de inventario</div>
        {daySalidas.length === 0 ? <p style={{ fontSize: 12, color: '#8B9199' }}>Sin salidas este día.</p> : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
            {daySalidas.map(m => (
              <div key={m.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14 }}>
                <span>{invName(m.invId)}{m.note && <span style={{ fontSize: 11, color: '#8B9199' }}> · {m.note}</span>}</span>
                <span className="mono stock-low">-{m.qty} {invUnit(m.invId)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function ItemModal({ data, onClose, onSave }) {
  const [form, setForm] = useState(data);
  const valid = form.name.trim() && form.unit.trim() && form.stock !== '' && form.minStock !== '';
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, background: 'rgba(0,0,0,0.6)' }}>
      <div className="card" style={{ padding: 16, width: '100%', maxWidth: 380 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <span className="display" style={{ fontWeight: 600 }}>Insumo</span>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#FBF7EE', cursor: 'pointer' }}><Icon size={20}>✕</Icon></button>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <label style={{ fontSize: 12, color: '#8B9199' }}>Nombre</label>
          <input className="input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
          <label style={{ fontSize: 12, color: '#8B9199' }}>Unidad (kg, unidad, ml...)</label>
          <input className="input" value={form.unit} onChange={e => setForm({ ...form, unit: e.target.value })} />
          <label style={{ fontSize: 12, color: '#8B9199' }}>Stock actual</label>
          <input type="number" className="input" value={form.stock} onChange={e => setForm({ ...form, stock: Number(e.target.value) })} />
          <label style={{ fontSize: 12, color: '#8B9199' }}>Stock mínimo (alerta)</label>
          <input type="number" className="input" value={form.minStock} onChange={e => setForm({ ...form, minStock: Number(e.target.value) })} />
          <button disabled={!valid} onClick={() => onSave(form)} className="btn btn-amber" style={{ padding: '10px 0', marginTop: 8, opacity: valid ? 1 : 0.5 }}>Guardar</button>
        </div>
      </div>
    </div>
  );
}

function MovementModal({ type, inventory, onClose, onSave }) {
  const [invId, setInvId] = useState(inventory[0] ? inventory[0].id : '');
  const [qty, setQty] = useState('');
  const [note, setNote] = useState('');
  const [dateKey, setDateKey] = useState(todayKey());
  const valid = invId && Number(qty) > 0;
  const isEntrada = type === 'entrada';
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, background: 'rgba(0,0,0,0.6)' }}>
      <div className="card" style={{ padding: 16, width: '100%', maxWidth: 380 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <span className="display" style={{ fontWeight: 600, color: isEntrada ? '#6FA97A' : '#D6553F' }}>{isEntrada ? 'Registrar entrada' : 'Registrar salida'}</span>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#FBF7EE', cursor: 'pointer' }}><Icon size={20}>✕</Icon></button>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <label style={{ fontSize: 12, color: '#8B9199' }}>Insumo</label>
          <select className="input" value={invId} onChange={e => setInvId(e.target.value)}>
            {inventory.map(inv => <option key={inv.id} value={inv.id}>{inv.name} ({inv.stock} {inv.unit})</option>)}
          </select>
          <label style={{ fontSize: 12, color: '#8B9199' }}>Cantidad</label>
          <input type="number" min="0" className="input" value={qty} onChange={e => setQty(e.target.value)} />
          <label style={{ fontSize: 12, color: '#8B9199' }}>Nota (opcional)</label>
          <input className="input" placeholder={isEntrada ? 'Ej: compra a proveedor' : 'Ej: merma, dañado'} value={note} onChange={e => setNote(e.target.value)} />
          <label style={{ fontSize: 12, color: '#8B9199' }}>Fecha</label>
          <input type="date" className="input" value={dateKey} onChange={e => setDateKey(e.target.value)} />
          <button disabled={!valid} onClick={() => onSave(invId, Number(qty), note, dateKey)} className={'btn ' + (isEntrada ? 'btn-green' : 'btn-danger')} style={{ padding: '10px 0', marginTop: 8, opacity: valid ? 1 : 0.5 }}>Guardar</button>
        </div>
      </div>
    </div>
  );
}

function DeleteSaleModal({ date, products, onClose, onConfirm }) {
  const [productName, setProductName] = useState(products[0] ? products[0].name : '');
  const [qty, setQty] = useState('');
  const [reason, setReason] = useState('');
  const [pwd, setPwd] = useState('');
  const selected = products.find(p => p.name === productName);
  const maxQty = selected ? selected.qty : 0;
  const valid = productName && Number(qty) > 0 && Number(qty) <= maxQty && reason.trim() && pwd;

  function submit() {
    if (!valid) return;
    onConfirm(productName, Number(qty), reason.trim(), pwd);
    setPwd('');
  }

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, background: 'rgba(0,0,0,0.6)' }}>
      <div className="card" style={{ padding: 16, width: '100%', maxWidth: 380 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <span className="display" style={{ fontWeight: 600, fontSize: 14, color: '#D6553F' }}>Eliminar platillos de {formatDateLabel(date)}</span>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#FBF7EE', cursor: 'pointer' }}><Icon size={18}>✕</Icon></button>
        </div>
        <p style={{ fontSize: 12, color: '#8B9199', marginBottom: 12 }}>Selecciona el platillo y la cantidad a quitar de las ventas de este día. Los insumos usados se devuelven al inventario.</p>
        {products.length === 0 ? (
          <p style={{ fontSize: 14, color: '#8B9199' }}>No hay ventas este día.</p>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <label style={{ fontSize: 12, color: '#8B9199' }}>Platillo vendido</label>
            <select className="input" value={productName} onChange={e => { setProductName(e.target.value); setQty(''); }}>
              {products.map(p => <option key={p.name} value={p.name}>{p.name} (vendidos: {p.qty})</option>)}
            </select>
            <label style={{ fontSize: 12, color: '#8B9199' }}>Cantidad a eliminar (máx. {maxQty})</label>
            <input type="number" min="1" max={maxQty} className="input" value={qty} onChange={e => setQty(e.target.value)} />
            <label style={{ fontSize: 12, color: '#8B9199' }}>Motivo</label>
            <input className="input" placeholder="Ej: pedido duplicado, error de cobro..." value={reason} onChange={e => setReason(e.target.value)} />
            <label style={{ fontSize: 12, color: '#8B9199' }}>Contraseña</label>
            <input type="password" className="input" value={pwd} onChange={e => setPwd(e.target.value)} onKeyDown={e => e.key === 'Enter' && submit()} />
            <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
              <button onClick={onClose} className="btn btn-ghost" style={{ flex: 1, padding: '10px 0' }}>Cancelar</button>
              <button onClick={submit} disabled={!valid} className="btn btn-danger" style={{ flex: 1, padding: '10px 0', opacity: valid ? 1 : 0.5 }}>Eliminar</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function PriceConfirmModal({ productName, oldPrice, newPrice, onClose, onConfirm }) {
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, background: 'rgba(0,0,0,0.6)' }}>
      <div className="card" style={{ padding: 16, width: '100%', maxWidth: 360 }}>
        <div className="display" style={{ fontWeight: 600, fontSize: 15, marginBottom: 8 }}>Cambiaste el precio</div>
        <p style={{ fontSize: 13, color: '#8B9199', marginBottom: 4 }}>
          <b style={{ color: '#FBF7EE' }}>{productName}</b>: {money(oldPrice)} → <b style={{ color: '#E3A23D' }}>{money(newPrice)}</b>
        </p>
        <p style={{ fontSize: 13, marginTop: 8, marginBottom: 14 }}>
          ¿Quieres actualizar también las ventas anteriores de este producto con el nuevo precio?
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <button onClick={() => onConfirm(true)} className="btn btn-amber" style={{ padding: '10px 0', fontSize: 12, fontWeight: 600, justifyContent: 'center' }}>Sí, actualizar ventas anteriores</button>
          <button onClick={() => onConfirm(false)} className="btn btn-ghost" style={{ padding: '10px 0', fontSize: 12, fontWeight: 600, justifyContent: 'center' }}>No, solo el precio nuevo en adelante</button>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#8B9199', fontSize: 12, textDecoration: 'underline', cursor: 'pointer', padding: '4px 0' }}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

function RecipeModal({ data, inventory, onClose, onSave }) {
  const [form, setForm] = useState(data);
  const valid = form.name.trim() && form.price !== '' && form.ingredients.length > 0;

  function addIngredient() {
    if (inventory.length === 0) return;
    setForm({ ...form, ingredients: [...form.ingredients, { invId: inventory[0].id, qty: 1 }] });
  }
  function updateIngredient(idx, field, value) {
    setForm({ ...form, ingredients: form.ingredients.map((ing, i) => i === idx ? { ...ing, [field]: field === 'qty' ? Number(value) : value } : ing) });
  }
  function removeIngredient(idx) {
    setForm({ ...form, ingredients: form.ingredients.filter((_, i) => i !== idx) });
  }

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16, background: 'rgba(0,0,0,0.6)' }}>
      <div className="card" style={{ padding: 16, width: '100%', maxWidth: 420, maxHeight: '85vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <span className="display" style={{ fontWeight: 600 }}>Receta / producto</span>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#FBF7EE', cursor: 'pointer' }}><Icon size={20}>✕</Icon></button>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <label style={{ fontSize: 12, color: '#8B9199' }}>Nombre del producto</label>
          <input className="input" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
          <label style={{ fontSize: 12, color: '#8B9199' }}>Categoría</label>
          <input className="input" value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} placeholder="Platos fuertes, Bebidas..." />
          <label style={{ fontSize: 12, color: '#8B9199' }}>Precio de venta</label>
          <input type="number" step="0.01" className="input" value={form.price} onChange={e => setForm({ ...form, price: Number(e.target.value) })} />

          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 8 }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: '#8B9199' }}>Insumos que descuenta</span>
            <button onClick={addIngredient} className="btn btn-ghost" style={{ fontSize: 12, padding: '4px 8px' }}>+ Insumo</button>
          </div>
          {form.ingredients.length === 0 && <p style={{ fontSize: 12, color: '#8B9199' }}>Agrega al menos un insumo para poder vender este producto.</p>}
          {form.ingredients.map((ing, idx) => (
            <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <select className="input" style={{ flex: 1 }} value={ing.invId} onChange={e => updateIngredient(idx, 'invId', e.target.value)}>
                {inventory.map(inv => <option key={inv.id} value={inv.id}>{inv.name}</option>)}
              </select>
              <input type="number" className="input" style={{ width: 70 }} value={ing.qty} onChange={e => updateIngredient(idx, 'qty', e.target.value)} />
              <button onClick={() => removeIngredient(idx)} style={{ background: 'none', border: 'none', color: '#D6553F', cursor: 'pointer' }}><Icon size={16}>🗑</Icon></button>
            </div>
          ))}

          <button disabled={!valid} onClick={() => onSave(form)} className="btn btn-amber" style={{ padding: '10px 0', marginTop: 12, opacity: valid ? 1 : 0.5 }}>Guardar receta</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
